apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-replay
  namespace: ppt-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-replay
  template:
    metadata:
      labels:
        app: telemetry-replay
    spec:
      containers:
        - name: telemetry-replay
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/demo/telemetry_replay.py
            - --host
            - 0.0.0.0
            - --port
            - "9108"
          ports:
            - name: metrics
              containerPort: 9108
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: app
              mountPath: /opt/demo
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: app
          configMap:
            name: ppt-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-replay
  namespace: ppt-demo
spec:
  selector:
    app: telemetry-replay
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: ppt-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/demo/loadgen.py"]
          env:
            - name: TARGET_URL
              value: http://gateway-demo:8000/v1/chat/completions
            - name: MODEL
              value: demo-model
            - name: INTERVAL_SECONDS
              value: "0.25"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 9109
          volumeMounts:
            - name: app
              mountPath: /opt/demo
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: app
          configMap:
            name: ppt-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: loadgen-metrics
  namespace: ppt-demo
spec:
  clusterIP: None
  selector:
    app: loadgen
  ports:
    - name: metrics
      port: 9109
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ppt-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ppt-demo
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ppt-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: light
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: ppt-demo-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ppt-demo
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
  type: NodePort
