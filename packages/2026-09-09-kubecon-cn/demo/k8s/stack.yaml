apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ppt-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: llm-d-inference-sim
        metrics_path: /metrics
        static_configs:
          - targets: ["inference-sim.ppt-demo.svc.cluster.local:8000"]
            labels:
              cluster_name: macos-kind
      - job_name: ppt-demo-gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["gateway-demo.ppt-demo.svc.cluster.local:9109"]
            labels:
              cluster_name: macos-kind
              proxy_role: gateway
      - job_name: ppt-demo-epp
        metrics_path: /metrics
        static_configs:
          - targets: ["epp-demo.ppt-demo.svc.cluster.local:9109"]
            labels:
              cluster_name: macos-kind
              proxy_role: epp
      - job_name: cross-layer-telemetry
        metrics_path: /metrics
        static_configs:
          - targets: ["telemetry-replay.ppt-demo.svc.cluster.local:9108"]
            labels:
              cluster_name: macos-kind
      - job_name: demo-loadgen
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["loadgen-metrics.ppt-demo.svc.cluster.local"]
            type: A
            port: 9109
            refresh_interval: 2s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: ppt-demo
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ppt-demo
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: ppt-demo
        orgId: 1
        folder: KubeCon TTFT
        type: file
        disableDeletion: false
        updateIntervalSeconds: 5
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-sim
  namespace: ppt-demo
  labels:
    app: inference-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-sim
  template:
    metadata:
      labels:
        app: inference-sim
        llm-d.ai/role: decode
    spec:
      containers:
        - name: inference-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - demo-model
            - --port
            - "8000"
            - --mode
            - echo
            - --force-dummy-tokenizer
            - --time-to-first-token
            - 200ms
            - --inter-token-latency
            - 15ms
            - --max-num-seqs
            - "4"
            - --time-factor-under-load
            - "2.5"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-sim
  namespace: ppt-demo
spec:
  selector:
    app: inference-sim
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-demo
  namespace: ppt-demo
  labels:
    app: gateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-demo
  template:
    metadata:
      labels:
        app: gateway-demo
    spec:
      containers:
        - name: gateway-demo
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/demo/traffic_proxy.py
            - --role
            - gateway
            - --upstream
            - http://epp-demo:8000
            - --listen-host
            - 0.0.0.0
            - --listen-port
            - "8000"
            - --metrics-port
            - "9109"
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9109
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /opt/demo
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: ppt-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-demo
  namespace: ppt-demo
spec:
  selector:
    app: gateway-demo
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
    - name: metrics
      port: 9109
      targetPort: metrics
  type: NodePort
---
